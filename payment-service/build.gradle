plugins {
    id 'java'
    id 'com.palantir.docker' version '0.36.0'
}

group = 'com.algerage'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.kafka:spring-kafka:3.3.2'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'commons-codec:commons-codec:1.3'
    implementation 'org.json:json:20160212'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.54'
    implementation 'com.sun.xml.ws:jaxws-rt:2.2.10'
    implementation 'commons-discovery:commons-discovery:0.5'
    implementation 'axis:axis-wsdl4j:1.5.1'
    implementation 'commons-codec:commons-codec:1.10'
}

test {
    useJUnitPlatform()
}

docker {
    name "${dockerRepoName}/payment-service:${version}"
    files tasks.bootJar.outputs.files
    buildArgs(['JAR_FILE': tasks.bootJar.archiveFileName.get()])
}