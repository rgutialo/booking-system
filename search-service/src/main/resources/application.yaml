server:
  port: 8085

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8092/realms/my-realm}
          #container --> issuer-uri: http://keycloack:8080/realms/my-realm
          #locally --> issuer-uri: http://localhost:8092/realms/my-realm
  kafka:
    bootstrap-servers: ${KAFKA_HOST:http://localhost:9092}
    bookingAckTopic: bookingAck
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: search-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.algerage.booking.domain.model.BookingMessageAck"

booking-service:
  url: ${BOOKING_SERVICE_URL:http://localhost:8081}